n_samples: 2048
cooldown_s: 300

base:
  min_it_per_knot: 10
  load_initial_sampling_state: true
  adaptive_kappa: true
  kappa_subsample: 128
  mixed_init_frac: 0.5
  start_knots: 15
  N_max_incr: 100
  motion_path: datasets/robot-object/sub10_largebox_000_original.npz
  knot_cost_threshold: 1000
  fall_floor_height: 0.40
  fall_drop_threshold: 0.25
  save_video: true
  save_top: 5
  save_fig: true
  save_samples_costs: false
  n_last_it: 1

trials:
  - solver: pcbo
    label: sr1e6_l10_awF_mix0p5
    scalar_reg: 1.0e6
    lambda_: 10.0
    flag_auto_weight: false
    mixed_init_frac: 0.5
    ini_cov_scale: 1.0
    use_loaded_mean_only: true
    N_it: 100

