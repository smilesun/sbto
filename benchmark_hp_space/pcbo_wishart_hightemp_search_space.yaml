# PCBO with Wishart population init at high covariance scale ("temperature").
# Sweeps wishart_cov_scale at 1x / 10x / 100x of the previous default (16),
# and wishart_n_components to vary mixture richness.
# N=16384 particles (max confirmed working).
#
# Generate:
#   uv run python benchmark/generate_config.py benchmark_hp_space/pcbo_wishart_hightemp_search_space.yaml
#
# Launch:
#   uv run python benchmark/launch_benchmark.py benchmark_recipes/pcbo_wishart_hightemp.yaml

output: benchmark_recipes/pcbo_wishart_hightemp.yaml

n_samples: 16384
cooldown_s: 120

base:
  start_knots: 15
  N_max_incr: 100
  motion_path: datasets/robot-object/sub10_largebox_000_original.npz
  knot_cost_threshold: 1000
  fall_floor_height: 0.40
  fall_drop_threshold: 0.25
  min_it_per_knot: 10
  load_initial_sampling_state: false
  warm_start_rundir: outputs/G1RobotObjRef2Delete/2026_04_21__09_07_04
  adaptive_kappa: true
  kappa_subsample: 128
  mixed_init_frac: 0.5
  save_video: true
  save_top: 5
  save_fig: true
  save_samples_costs: false
  n_last_it: 1

search:
  # ── PCBO + Wishart init, high-temperature sweep ────────────────────────────
  # wishart_cov_scale × wishart_n_components: 3 × 2 = 6 trials
  pcbo:
    beta:                [1.0e10]
    scalar_reg:          [1.0e6]
    lambda_:             [10.0]
    flag_auto_weight:    [false]
    ini_cov_scale:       [1.0]
    use_loaded_mean_only: [false]
    N_it:                [100]
    population_init:     [wishart]
    wishart_n_components: [4, 8]
    wishart_cov_scale:   [16.0, 160.0, 1600.0]
    wishart_seed:        [0]
