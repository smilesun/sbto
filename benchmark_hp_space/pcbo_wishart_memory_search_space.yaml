# PCBO memory-capacity sweep with Wishart population initialisation.
# Generates a sequential doubling sweep of particle count and stops after the
# first GPU/CPU memory-capacity failure.
#
# Generate:
#   uv run python benchmark/generate_config.py benchmark_hp_space/pcbo_wishart_memory_search_space.yaml
#
# Launch:
#   bash benchmark/launch.sh benchmark_recipes/pcbo_wishart_memory_limit.yaml

output: benchmark_recipes/pcbo_wishart_memory_limit.yaml

n_samples: 2048
cooldown_s: 120
stop_on_memory_failure: true

base:
  start_knots: 15
  N_max_incr: 100
  motion_path: datasets/robot-object/sub10_largebox_000_original.npz
  knot_cost_threshold: 1000
  fall_floor_height: 0.40
  fall_drop_threshold: 0.25
  min_it_per_knot: 10
  load_initial_sampling_state: false
  adaptive_kappa: true
  kappa_subsample: 128
  mixed_init_frac: 0.5
  warm_start_rundir: outputs/G1RobotObjRef2Delete/2026_04_21__09_07_04
  save_video: true
  save_top: 5
  save_fig: true
  save_samples_costs: false
  n_last_it: 1

search:
  pcbo:
    n_samples: [4096, 8192, 16384, 32768, 65536]
    beta: [1.0e10]
    scalar_reg: [1.0e6]
    lambda_: [10.0]
    flag_auto_weight: [false]
    ini_cov_scale: [10.0]
    use_loaded_mean_only: [false]
    N_it: [100]
    population_init: [wishart]
    wishart_n_components: [4]
    wishart_cov_scale: [16.0]
    wishart_seed: [0]
