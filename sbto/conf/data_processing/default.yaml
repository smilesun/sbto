# Exp dir
data_dir: "./outputs"
# Save figures
save_fig: true
# Save video
save_video: true
# Split state trajectory in saved data
split_state: true
# Save all samples and costs from the optimization
save_samples_costs: false
# Save all minimum costs samples per iteration 
save_best_samples_it: true
# Save top trajectories from the optimization
# if 0 < <save_top> < 1: save top <save_top>% trajectories
# if <save_top> >= 1: save top #<save_top> trajectories
save_top: 1
# Remove keys from data
remove_keys: ["x", "obs"]
# Take top trajectories from the <n_last_it> last iterations only
n_last_it: 0
# Save diversity plots every n iterations for all solvers; 0 means only the last iteration
diversity_plot_every: 0
# Only include trajectories with cost below this threshold in the knot distribution plot
# (filters out fallen/degenerate solutions); set to .inf to disable
knot_cost_threshold: 1000
# Fall detection for knot distribution plot: root z below floor_height OR drop > drop_threshold → excluded
# Set fall_floor_height to 0.0 to disable fall filtering
fall_floor_height: 0.40
fall_drop_threshold: 0.25
